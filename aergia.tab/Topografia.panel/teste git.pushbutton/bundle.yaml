title:
  en_us: Topo from CAD
  pt_br: Topo do CAD
tooltip:
  en_us: |
    Create a native Revit Toposolid (with TopographySurface fallback)
    from contour curves of a linked DWG. Select the layers that contain
    the 3D contour polylines; the command computes a convex-hull boundary
    and adds interior points with the correct Z from each contour.
  pt_br: |
    Cria uma Toposolid nativa do Revit (com fallback para TopographySurface)
    a partir das curvas de nível 3D de um CAD link DWG. Marque os layers
    das curvas; o comando calcula um boundary por convex hull e adiciona
    os vértices das curvas como pontos internos, cada um com o Z correto.
author: "{{author}}"
